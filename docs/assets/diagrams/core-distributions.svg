<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">Core and distributions</title>
  <desc id="d2">A distribution — reference, your client, or a demo — consumes the generic core (engine, connectors, templates, conventions) and never modifies it.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace}
    .surf{fill:#f5f4ef;stroke:#dcd8cc;stroke-width:1.5}
    .surf2{fill:#efede6}
    .tp{fill:#23241f}.ts{fill:#6f6f67}.tt{fill:#8a897e}
    .ac{fill:#4f6bed}.acs{stroke:#4f6bed;fill:none}
    @media (prefers-color-scheme:dark){
      .surf{fill:#26262b;stroke:#3a3a42}.surf2{fill:#1f2024}
      .tp{fill:#ededed}.ts{fill:#b2b2aa}.tt{fill:#8f8f88}
      .ac{fill:#8aa0ff}.acs{stroke:#8aa0ff}
    }
  </style>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ac"/>
    </marker>
  </defs>
  <text x="30" y="32" font-size="17" font-weight="700" class="tp">Core and distributions</text>
  <text x="30" y="53" font-size="12.5" class="ts">A distribution consumes the core — it never modifies it.</text>
  <text x="380" y="88" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" class="ac">DISTRIBUTIONS · PER DEPLOYMENT</text>
  <rect x="40" y="100" width="210" height="64" rx="12" class="surf"/>
  <text x="145" y="129" text-anchor="middle" font-size="15" font-weight="700" class="tp mono">reference</text>
  <text x="145" y="150" text-anchor="middle" font-size="10.5" class="ts">the public starter kit</text>
  <rect x="275" y="100" width="210" height="64" rx="12" class="surf"/>
  <text x="380" y="129" text-anchor="middle" font-size="15" font-weight="700" class="tp mono">acme</text>
  <text x="380" y="150" text-anchor="middle" font-size="10.5" class="ts">your client</text>
  <rect x="510" y="100" width="210" height="64" rx="12" class="surf"/>
  <text x="615" y="129" text-anchor="middle" font-size="15" font-weight="700" class="tp mono">demo</text>
  <text x="615" y="150" text-anchor="middle" font-size="10.5" class="ts">live-wired showcase</text>
  <text x="380" y="186" text-anchor="middle" font-size="11" class="ts">each adds conventions · roles · presets · projects — and consumes ↓</text>
  <line x1="145" y1="194" x2="145" y2="230" class="acs" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah2)">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="380" y1="194" x2="380" y2="230" class="acs" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah2)">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="615" y1="194" x2="615" y2="230" class="acs" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah2)">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1s" repeatCount="indefinite"/>
  </line>
  <rect x="40" y="240" width="680" height="84" rx="14" class="surf"/>
  <text x="72" y="282" font-size="22" font-weight="700" class="tp mono">core/</text>
  <text x="72" y="306" font-size="12" class="ts">the generic framework — engine · connectors · templates · conventions</text>
  <text x="688" y="282" text-anchor="end" font-size="11" class="tt">client-agnostic · open source</text>
</svg>
