name: Bug report
description: Report a defect or unexpected behavior in the framework, a connector, or a skill.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. The more concrete the reproduction steps, the faster a fix can land.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what went wrong.
      placeholder: "`python -m core.cli pull` fails with `KeyError: 'overlay'` on a project that has no overlay defined."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Numbered steps that consistently reproduce the issue.
      placeholder: |
        1. Clone the repo
        2. `cd ade-ops && python -m venv .venv && source .venv/bin/activate`
        3. `python -m core.cli preflight` → OK
        4. `python -m core.cli pull --env dev --scope notebooks` → fails
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Pull completes and writes notebook files under `state/dev/notebooks/`."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and stack trace if applicable.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      multiple: true
      options:
        - engine (config / overlay / state / operations)
        - connector (Databricks)
        - connector (Fabric)
        - connector (Power BI)
        - CLI
        - skill (`/ops-*`)
        - skill (`/pbir-*`)
        - skill (`/powerbi-*`)
        - skill (`/fabric-*`)
        - skill (`/databricks-*`)
        - skill (other)
        - documentation
        - onboarding
        - other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.10"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 14.5 / Ubuntu 22.04"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: ade-ops commit (git rev-parse HEAD)
      placeholder: "c1a8d4b"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that would help — config snippets (with secrets redacted), logs, screenshots.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have redacted any secret / credential / tenant ID / workspace UUID from the snippets above
          required: true
