databricks:
  catalog: acme_prod
  schema: default
  workspace_path: /Shared/AcmePowerBI/PROD

power_bi:
  report_workspace_id: ${PBI_WORKSPACE_PROD}
  model_workspace_id: ${PBI_WORKSPACE_PROD}

# See overlays/dev.yaml for the env-var meaning. PROD reads the acme_prod catalog.
transforms:
  - pattern: "<your-databricks-sql-host>"
    replace: ${DATABRICKS_SQL_HOST}
  - pattern: "<your-warehouse-id>"
    replace: ${DATABRICKS_WAREHOUSE_ID}
  - pattern: "<your-catalog>"
    replace: "acme_prod"

exclude:
  - "_setup/*"
  - "_*"
