# databricks-fabric-migration credentials — TEMPLATE
#
# Copy this file to ``credentials.yaml`` (gitignored) and fill in real values.
# NEVER commit credentials.yaml.
#
# Databricks: PAT for your workspace. Generate at:
#   https://<your-workspace>.cloud.databricks.com/?o=...#setting/account/user/tokens
#
# Fabric: choose one of the auth methods below. The az_cli flow uses your
#   local Azure CLI session — run `az login --allow-no-subscriptions
#   --tenant <your-tenant>.onmicrosoft.com` first, then the engine picks up
#   the active identity automatically. No secrets needed in this file for
#   the az_cli path.

databricks:
  token: ${DATABRICKS_TOKEN}   # or paste a literal "dapi..." here

fabric:
  auth_method: az_cli
  az_tenant_id: ${FABRIC_TENANT_ID}
  # For service principal alternative:
  # auth_method: service_principal
  # client_id: ${FABRIC_CLIENT_ID}
  # client_secret: ${FABRIC_CLIENT_SECRET}
  # tenant_id: ${FABRIC_TENANT_ID}
