# acme-powerbi credentials — TEMPLATE
#
# Copy this file to ``credentials.yaml`` (gitignored) and fill in real values.
# NEVER commit credentials.yaml.
#
# Databricks: PAT for your workspace (the Import-mode semantic model also
#   connects with this identity at refresh time). Generate at:
#   https://<your-workspace>.cloud.databricks.com/?o=...#setting/account/user/tokens
#
# Fabric / Power BI: publishing the semantic model + report to a Power BI
#   workspace uses the az_cli flow — run `az login --allow-no-subscriptions
#   --tenant <your-tenant>.onmicrosoft.com` first, then the engine picks up the
#   active identity automatically. A Power BI Pro workspace is enough; no
#   Fabric capacity is required for this Import-mode scenario.

databricks:
  token: ${DATABRICKS_TOKEN}   # or paste a literal "dapi..." here

fabric:
  auth_method: az_cli
  az_tenant_id: ${FABRIC_TENANT_ID}
  # For service principal alternative:
  # auth_method: service_principal
  # client_id: ${FABRIC_CLIENT_ID}
  # client_secret: ${FABRIC_CLIENT_SECRET}
  # tenant_id: ${FABRIC_TENANT_ID}
